[project]
name = "applymind-api"
version = "0.1.0"
description = "ApplyMind API — RAG-powered job search and application agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=44.0.0",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "feedparser>=6.0.11",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "pgvector>=0.3.6",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "factory-boy>=3.3.1",
  "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
