services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: applymind
      POSTGRES_PASSWORD: applymind
      POSTGRES_DB: applymind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applymind -d applymind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://applymind:applymind@db:5432/applymind
      DATABASE_URL_SYNC: postgresql://applymind:applymind@db:5432/applymind
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "cd /app/apps/api && alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://applymind:applymind@db:5432/applymind
      DATABASE_URL_SYNC: postgresql://applymind:applymind@db:5432/applymind
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_DIR: /app/data
    volumes:
      - ./apps/api:/app/apps/api
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "cd /app/apps/api &&
             celery -A app.workers.celery_app worker --beat --loglevel=info"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
